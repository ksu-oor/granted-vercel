name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans the checked-out tree (not history: older commits contain
      # credentials that were rotated rather than rewritten out).
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 dir /repo --no-banner --redact
